apiVersion: v1
kind: Service
metadata:
  name: todo-ui
  labels:
    {{- include "todo-listercise.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: todo-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.nodePorts.ui }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui
  labels:
    {{- include "todo-listercise.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-ui
  template:
    metadata:
      labels:
        app: todo-ui
    spec:
      containers:
        - name: nginx
          image: {{ .Values.images.todoUi }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
